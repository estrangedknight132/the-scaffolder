[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-scaffolder"
version = "0.1.0"
dependencies = [
    "questionary",
]

[project.scripts]
scaffold = "scaffolder.main:create_scaffolder"

[tool.setuptools]
packages = ["scaffolder"]
package-data = { "scaffolder" = ["templates.json"] }