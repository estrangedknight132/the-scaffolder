[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-scaffolder"
version = "0.1.0"
dependencies = [
    "questionary",
]
description = "A powerful project scaffolding tool."
readme = "README.md"
requires-python = ">=3.7"

[project.scripts]
scaffold = "scaffolder.main:create_scaffolder"